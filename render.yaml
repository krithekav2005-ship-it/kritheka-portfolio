services:
  - type: web
    name: kritheka-portfolio-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        fromDatabase:
          name: kritheka-portfolio-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://krithekav2005-ship-it.github.io,http://localhost:5500,http://127.0.0.1:5500

databases:
  - name: kritheka-portfolio-db
    databaseName: portfolio_messages
    user: portfolio_user
